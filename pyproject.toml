[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "jamboree-sdv"
version = "0.1.0"
description = "Local supplied-distribution Copulas pilot with explicit NCCR rules"
requires-python = ">=3.11,<3.14"
dependencies = ["copulas>=0.12,<0.15", "numpy>=1.26,<3", "scipy>=1.13,<2", "pandas>=2.2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
jamboree-sdv = "jamboree_sdv.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jamboree_sdv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

